name: Refresh portfolio content

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'patents/**'
      - 'publications/**'
      - 'profile.json'
      - '*.js'
      - '*.mjs'
      - '*.css'
      - '.github/workflows/refresh-content.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-portfolio-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read the latest main branch
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Generate the page and management lists
        run: node build.mjs

      - name: Save generated content
        id: save
        shell: bash
        run: |
          git add -- index.html MANAGE.md patent-review.html version.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Regenerate portfolio from edited content"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the generated main branch
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
