name: Refresh portfolio content

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'patents/**'
      - 'publications/**'
      - 'profile.json'
      - '*.js'
      - '*.mjs'
      - 'sync_scholar.py'
      - '*.css'
      - '.github/workflows/refresh-content.yml'
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-portfolio-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read the latest main branch
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Sync Google Scholar metrics
        id: scholar
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[sync-scholar]')
        continue-on-error: true
        run: python3 sync_scholar.py

      - name: Generate the page and management lists
        run: node build.mjs

      - name: Save generated content
        id: save
        shell: bash
        run: |
          git add -- profile.json index.html MANAGE.md patent-review.html version.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Regenerate portfolio from edited content"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the generated main branch
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent

      - name: Report a failed Scholar refresh
        if: steps.scholar.outcome == 'failure'
        run: exit 1
